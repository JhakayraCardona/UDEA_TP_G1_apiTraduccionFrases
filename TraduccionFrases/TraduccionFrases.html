<html ng-app="TraduccionFrasesApp">

<head>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="estilos/estilos.css" rel="stylesheet">
    <!-- AngularJS Core -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script src="js/app.js"></script>

    <!-- Modelos -->
    <script src="js/modelos/frase.js"></script>

    <!-- Modelos -->
    <script src="js/servicios/frase.servicio.js"></script>

    <!-- Controlador -->
    <script src="js/controladores/frase.controlador.js"></script>
    <script src="js/controladores/app.controlador.js"></script>
</head>

<body ng-controller="TraduccionFrasesControlador">
    <nav class="navbar navbar-dark bg-dark">
        <span class="navbar-text text-white-50">
            <i class="bi bi-translate"></i>
            El Políglota de la U de A
        </span>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <!-- Menu Lateral -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse p-0">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link rounded" ng-click="cambiarVista('frases')">
                            <i class="bi-collection me-2"></i>
                            Frases
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded" ng-click="cambiarVista('idiomas')">
                            <i class="bi bi-globe me-2"></i>
                            Idiomas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link rounded" ng-click="cambiarVista('traducciones')">
                            <i class="bi bi-chat-left-text me-2"></i>
                            Traducción
                        </a>
                    </li>
                </ul>
            </nav>
            <!-- Vistas -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">
                <div ng-if="vistaActual === 'frases'" ng-controller="FraseControlador">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                        <h2>Gestión de Frases y sus Traducciones</h2>
                    </div>
                    <div class="row">
                        <div class="list-group shadow-sm">
                            <button type="button" ng-repeat="frase in frases"
                                class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                <span class="text-truncate me-2">{{ frase.texto }}</span>
                                <span class="btn btn-xs btn-danger p-1 py-0 text-white" ng-click="eliminar(frase.id)">
                                    <i class="bi bi-trash"></i>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>

</html>
